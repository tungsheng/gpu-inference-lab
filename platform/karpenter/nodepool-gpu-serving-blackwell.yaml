apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-serving-blackwell
spec:
  weight: 30
  template:
    metadata:
      labels:
        workload: gpu
        serving: vllm
        gpu-arch: blackwell
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-serving

      taints:
        - key: gpu
          value: "true"
          effect: NoSchedule

      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - p6-b200.48xlarge
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux

  limits:
    cpu: "256"
    memory: 2048Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m

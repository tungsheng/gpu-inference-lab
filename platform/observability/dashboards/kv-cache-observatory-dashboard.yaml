apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kv-cache-observatory
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kv-cache-observatory-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "expr": "avg(vllm:kv_cache_usage_perc{namespace=\"app\"}) or avg(vllm_kv_cache_usage_perc{namespace=\"app\"}) or avg(vllm:gpu_cache_usage_perc{namespace=\"app\"}) or avg(vllm_gpu_cache_usage_perc{namespace=\"app\"})",
              "legendFormat": "kv usage",
              "refId": "A"
            }
          ],
          "title": "GPU KV Cache Utilization",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "sum(rate(vllm:prefix_cache_hits_total{namespace=\"app\"}[5m])) or sum(rate(vllm_prefix_cache_hits_total{namespace=\"app\"}[5m])) or sum(rate(vllm:prompt_tokens_cached_total{namespace=\"app\"}[5m])) or sum(rate(vllm_prompt_tokens_cached_total{namespace=\"app\"}[5m])) or sum(rate(vllm:gpu_prefix_cache_hits_total{namespace=\"app\"}[5m])) or sum(rate(vllm:gpu_prefix_cache_hits{namespace=\"app\"}[5m]))",
              "legendFormat": "hit tokens/s",
              "refId": "A"
            },
            {
              "expr": "(sum(rate(vllm:prefix_cache_queries_total{namespace=\"app\"}[5m])) - sum(rate(vllm:prefix_cache_hits_total{namespace=\"app\"}[5m]))) or (sum(rate(vllm_prefix_cache_queries_total{namespace=\"app\"}[5m])) - sum(rate(vllm_prefix_cache_hits_total{namespace=\"app\"}[5m]))) or (sum(rate(vllm:prompt_tokens_total{namespace=\"app\"}[5m])) - sum(rate(vllm:prompt_tokens_cached_total{namespace=\"app\"}[5m]))) or (sum(rate(vllm_prompt_tokens_total{namespace=\"app\"}[5m])) - sum(rate(vllm_prompt_tokens_cached_total{namespace=\"app\"}[5m]))) or (sum(rate(vllm:gpu_prefix_cache_queries_total{namespace=\"app\"}[5m])) - sum(rate(vllm:gpu_prefix_cache_hits_total{namespace=\"app\"}[5m]))) or (sum(rate(vllm:gpu_prefix_cache_queries{namespace=\"app\"}[5m])) - sum(rate(vllm:gpu_prefix_cache_hits{namespace=\"app\"}[5m])))",
              "legendFormat": "miss tokens/s",
              "refId": "B"
            }
          ],
          "title": "Prefix Cache Hits And Misses",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "targets": [
            {
              "expr": "sum(vllm:num_requests_waiting{namespace=\"app\"})",
              "legendFormat": "waiting",
              "refId": "A"
            },
            {
              "expr": "sum(vllm:num_requests_running{namespace=\"app\"})",
              "legendFormat": "running",
              "refId": "B"
            }
          ],
          "title": "Request Pressure",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:request_queue_time_seconds_bucket{namespace=\"app\"}[5m])) by (le))",
              "legendFormat": "queue",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:request_prefill_time_seconds_bucket{namespace=\"app\"}[5m])) by (le))",
              "legendFormat": "prefill",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:request_decode_time_seconds_bucket{namespace=\"app\"}[5m])) by (le))",
              "legendFormat": "decode",
              "refId": "C"
            }
          ],
          "title": "P95 Queue Prefill Decode",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "id": 5,
          "targets": [
            {
              "expr": "avg(DCGM_FI_DEV_FB_USED{namespace=\"monitoring\"}) * 1048576",
              "legendFormat": "used",
              "refId": "A"
            },
            {
              "expr": "avg(DCGM_FI_DEV_FB_FREE{namespace=\"monitoring\"}) * 1048576",
              "legendFormat": "free",
              "refId": "B"
            }
          ],
          "title": "GPU Framebuffer Memory",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "id": 6,
          "targets": [
            {
              "expr": "sum(rate(vllm:kv_cache_evictions_total{namespace=\"app\"}[5m])) or vector(0)",
              "legendFormat": "evictions/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(vllm:kv_cache_reloads_total{namespace=\"app\"}[5m])) or vector(0)",
              "legendFormat": "reloads/s",
              "refId": "B"
            }
          ],
          "title": "KV Evictions And Reloads",
          "type": "timeseries"
        },
        {
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "id": 7,
          "targets": [
            {
              "expr": "avg(vllm:kv_cache_active_blocks{namespace=\"app\"}) or avg(vllm_kv_cache_active_blocks{namespace=\"app\"}) or vector(0)",
              "legendFormat": "active blocks",
              "refId": "A"
            },
            {
              "expr": "avg(vllm:kv_cache_free_blocks{namespace=\"app\"}) or avg(vllm_kv_cache_free_blocks{namespace=\"app\"}) or vector(0)",
              "legendFormat": "free blocks",
              "refId": "B"
            },
            {
              "expr": "avg(vllm:kv_cache_fragmented_blocks{namespace=\"app\"}) or avg(vllm_kv_cache_fragmented_blocks{namespace=\"app\"}) or vector(0)",
              "legendFormat": "fragmented blocks",
              "refId": "C"
            }
          ],
          "title": "KV Block Pressure",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "gpu-inference",
        "kv-cache",
        "observatory"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-2h",
        "to": "now"
      },
      "timezone": "utc",
      "title": "KV Cache Observatory",
      "version": 1
    }

name: Shell Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Terraform init
        run: terraform -chdir=infra/env/dev init -backend=false -input=false

      - name: Terraform validate
        run: |
          terraform -chdir=infra/env/dev validate
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate
          terraform fmt -check -recursive infra/

      - name: Bash syntax
        run: |
          chmod +x scripts/up scripts/verify scripts/down scripts/evaluate scripts/experiment scripts/failure test/*.sh
          bash -n scripts/_common.sh scripts/lib/*.sh scripts/up scripts/verify scripts/down scripts/evaluate scripts/experiment scripts/failure test/*.sh test/helpers/*.sh

      - name: Shellcheck
        run: |
          shellcheck scripts/_common.sh scripts/lib/*.sh scripts/up scripts/verify scripts/down scripts/evaluate scripts/experiment scripts/failure test/*.sh test/helpers/*.sh

      - name: Install Python tooling
        run: pip install --quiet ruff

      - name: Python syntax
        run: python3 -m compileall -q scripts/lib/validate_report.py observatory/kv-cache/kv_observe.py experiments/fp4/quantization

      - name: Ruff
        run: ruff check scripts/lib/validate_report.py observatory/kv-cache/kv_observe.py experiments/fp4/quantization

      - name: Experiment catalog validation
        run: ./scripts/experiment validate

      - name: Shell tests
        run: ./test/run.sh

  <text x="264" y="123" font-family="Arial, sans-serif" font-size="13" fill="#111827">11.92s</text>
  <text x="742" y="123" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">waiting 0</text>

  <text x="32" y="164" font-family="Arial, sans-serif" font-size="13" fill="#111827">1.05 req/s</text>
  <rect x="184" y="149" width="83" height="18" rx="3" fill="#2563eb"/>
  <text x="278" y="163" font-family="Arial, sans-serif" font-size="13" fill="#111827">14.31s</text>
  <text x="742" y="163" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">waiting 0</text>

  <text x="32" y="204" font-family="Arial, sans-serif" font-size="13" fill="#111827">1.10 req/s</text>
  <rect x="184" y="189" width="125" height="18" rx="3" fill="#2563eb"/>
  <text x="320" y="203" font-family="Arial, sans-serif" font-size="13" fill="#111827">21.67s</text>
  <text x="742" y="203" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">waiting 0</text>

  <text x="32" y="244" font-family="Arial, sans-serif" font-size="13" fill="#111827">1.15 req/s</text>
  <rect x="184" y="229" width="204" height="18" rx="3" fill="#f59e0b"/>
  <text x="399" y="243" font-family="Arial, sans-serif" font-size="13" fill="#111827">35.35s</text>
  <text x="742" y="243" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">waiting 8</text>

  <text x="32" y="284" font-family="Arial, sans-serif" font-size="13" fill="#111827">1.20 req/s</text>
  <rect x="184" y="269" width="314" height="18" rx="3" fill="#f59e0b"/>

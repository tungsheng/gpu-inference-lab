<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" role="img" aria-labelledby="title desc">
  <title id="title">8192/300 long-context latency knee</title>
  <desc id="desc">P95 request latency rises sharply after 1.10 requests per second; admission at 1.25 requests per second lowers p95 latency while reporting dropped demand.</desc>
  <rect width="860" height="450" fill="#ffffff"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">8192/300 long-context knee</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">P95 latency seconds, with peak waiting requests shown at right</text>
  <text x="178" y="94" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">0s</text>
  <text x="351" y="94" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">30s</text>
  <text x="525" y="94" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">60s</text>
  <text x="696" y="94" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">90s</text>
  <line x1="184" y1="102" x2="184" y2="374" stroke="#e5e7eb"/>
  <line x1="358" y1="102" x2="358" y2="374" stroke="#e5e7eb"/>
  <line x1="531" y1="102" x2="531" y2="374" stroke="#e5e7eb"/>
  <line x1="704" y1="102" x2="704" y2="374" stroke="#e5e7eb"/>

  <text x="32" y="124" font-family="Arial, sans-serif" font-size="13" fill="#111827">1.00 req/s</text>

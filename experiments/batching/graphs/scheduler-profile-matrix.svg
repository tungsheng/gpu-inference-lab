<svg xmlns="http://www.w3.org/2000/svg" width="920" height="510" viewBox="0 0 920 510" role="img" aria-labelledby="title desc">
  <title id="title">Batching scheduler profile matrix</title>
  <desc id="desc">Dynamic defaults have the lowest p95 latency and highest generated tokens per second in steady and burst 512/128 runs.</desc>
  <rect width="920" height="510" fill="#ffffff"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Scheduler profile matrix for 512/128</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Blue bars: generated tokens/sec. Orange bars: p95 latency seconds.</text>
  <text x="312" y="96" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">tokens/sec</text>
  <text x="662" y="96" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">p95 latency</text>

  <text x="32" y="125" font-family="Arial, sans-serif" font-size="13" fill="#111827">steady dynamic-default</text>
  <rect x="292" y="110" width="179" height="16" rx="3" fill="#2563eb"/>
  <text x="482" y="123" font-family="Arial, sans-serif" font-size="12" fill="#111827">949</text>
  <rect x="650" y="110" width="3" height="16" rx="3" fill="#f59e0b"/>
  <text x="666" y="123" font-family="Arial, sans-serif" font-size="12" fill="#111827">1.66s</text>

  <text x="32" y="165" font-family="Arial, sans-serif" font-size="13" fill="#111827">steady limited-batching</text>
  <rect x="292" y="150" width="143" height="16" rx="3" fill="#2563eb"/>
  <text x="446" y="163" font-family="Arial, sans-serif" font-size="12" fill="#111827">760</text>
  <rect x="650" y="150" width="20" height="16" rx="3" fill="#f59e0b"/>
  <text x="681" y="163" font-family="Arial, sans-serif" font-size="12" fill="#111827">10.55s</text>

  <text x="32" y="205" font-family="Arial, sans-serif" font-size="13" fill="#111827">steady constrained-scheduler</text>
  <rect x="292" y="190" width="26" height="16" rx="3" fill="#2563eb"/>
  <text x="329" y="203" font-family="Arial, sans-serif" font-size="12" fill="#111827">137</text>
  <rect x="650" y="190" width="115" height="16" rx="3" fill="#f59e0b"/>
  <text x="776" y="203" font-family="Arial, sans-serif" font-size="12" fill="#111827">59.72s</text>

  <line x1="32" y1="230" x2="888" y2="230" stroke="#e5e7eb"/>

  <text x="32" y="265" font-family="Arial, sans-serif" font-size="13" fill="#111827">burst dynamic-default</text>
  <rect x="292" y="250" width="340" height="16" rx="3" fill="#2563eb"/>
  <text x="643" y="263" font-family="Arial, sans-serif" font-size="12" fill="#111827">1806</text>
  <rect x="650" y="250" width="13" height="16" rx="3" fill="#f59e0b"/>
  <text x="674" y="263" font-family="Arial, sans-serif" font-size="12" fill="#111827">6.79s</text>

  <text x="32" y="305" font-family="Arial, sans-serif" font-size="13" fill="#111827">burst limited-batching</text>
  <rect x="292" y="290" width="149" height="16" rx="3" fill="#2563eb"/>
  <text x="452" y="303" font-family="Arial, sans-serif" font-size="12" fill="#111827">792</text>
  <rect x="650" y="290" width="40" height="16" rx="3" fill="#f59e0b"/>
  <text x="701" y="303" font-family="Arial, sans-serif" font-size="12" fill="#111827">20.53s</text>

  <text x="32" y="345" font-family="Arial, sans-serif" font-size="13" fill="#111827">burst constrained-scheduler</text>
  <rect x="292" y="330" width="26" height="16" rx="3" fill="#2563eb"/>
  <text x="329" y="343" font-family="Arial, sans-serif" font-size="12" fill="#111827">137</text>
  <rect x="650" y="330" width="230" height="16" rx="3" fill="#f59e0b"/>
  <text x="768" y="367" font-family="Arial, sans-serif" font-size="12" fill="#111827">119.09s</text>

  <rect x="32" y="392" width="856" height="56" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="52" y="416" font-family="Arial, sans-serif" font-size="13" fill="#111827">Readout: explicit sequence and batched-token caps limited useful work before they improved latency.</text>
  <text x="52" y="438" font-family="Arial, sans-serif" font-size="13" fill="#111827">Dynamic defaults produced the strongest useful-work and tail-latency result in both measured cases.</text>
  <text x="32" y="480" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Source: curated reports in experiments/batching/results.md</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
  <title id="title">Request pattern utilization matrix</title>
  <desc id="desc">Steady traffic has full delivery and low latency; burst and spike-to-zero traffic drop work while active concurrency reaches the profile edge.</desc>
  <rect width="840" height="430" fill="#ffffff"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Request pattern utilization</text>
  <text x="32" y="64" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Green bars: delivery ratio. Red bars: p95 latency seconds.</text>
  <text x="280" y="96" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">delivery ratio</text>
  <text x="590" y="96" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">p95 latency</text>

  <text x="32" y="126" font-family="Arial, sans-serif" font-size="13" fill="#111827">steady-small</text>
  <rect x="250" y="111" width="230" height="18" rx="3" fill="#059669"/>
  <text x="492" y="125" font-family="Arial, sans-serif" font-size="12" fill="#111827">1.000</text>
  <rect x="590" y="111" width="33" height="18" rx="3" fill="#dc2626"/>
  <text x="634" y="125" font-family="Arial, sans-serif" font-size="12" fill="#111827">1.29s</text>

  <text x="32" y="176" font-family="Arial, sans-serif" font-size="13" fill="#111827">burst-small</text>
  <rect x="250" y="161" width="201" height="18" rx="3" fill="#059669"/>
  <text x="463" y="175" font-family="Arial, sans-serif" font-size="12" fill="#111827">0.875</text>
  <rect x="590" y="161" width="219" height="18" rx="3" fill="#dc2626"/>
  <text x="654" y="197" font-family="Arial, sans-serif" font-size="12" fill="#111827">8.56s, active 127</text>

  <text x="32" y="226" font-family="Arial, sans-serif" font-size="13" fill="#111827">uneven-size-mix</text>
  <rect x="250" y="211" width="229" height="18" rx="3" fill="#059669"/>
  <text x="491" y="225" font-family="Arial, sans-serif" font-size="12" fill="#111827">0.997</text>
  <rect x="590" y="211" width="201" height="18" rx="3" fill="#dc2626"/>
  <text x="624" y="247" font-family="Arial, sans-serif" font-size="12" fill="#111827">7.87s, wider mixed tail</text>

  <text x="32" y="276" font-family="Arial, sans-serif" font-size="13" fill="#111827">spike-to-zero</text>
  <rect x="250" y="261" width="183" height="18" rx="3" fill="#059669"/>
  <text x="445" y="275" font-family="Arial, sans-serif" font-size="12" fill="#111827">0.798</text>
  <rect x="590" y="261" width="216" height="18" rx="3" fill="#dc2626"/>
  <text x="654" y="297" font-family="Arial, sans-serif" font-size="12" fill="#111827">8.45s, active 128</text>

  <rect x="32" y="330" width="776" height="48" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="52" y="358" font-family="Arial, sans-serif" font-size="13" fill="#111827">Readout: the same default profile behaves differently by traffic shape; burst handling needs admission or capacity, not just steady-state evidence.</text>
  <text x="32" y="408" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Source: curated reports in experiments/request-patterns/results.md</text>
</svg>
